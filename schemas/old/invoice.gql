updatedBy: Long
}

enum InvoiceStatus {
CANCELLED
DRAFT
PAID
PARTIALLY_PAID
POSTED
REVERSED
}

Mutation.reverseInvoice(
reason: String
uid: String!
reversalDate: LocalDate
): Response_AccountInvoice
Mutation.recordInvoiceReceipt(
input: ReceiptDtoInput!
): Response_AccountInvoice
Mutation.postInvoice(
uid: String!
): Response_AccountInvoice
Mutation.saveInvoice(
input: InvoiceDtoInput!
): Response_AccountInvoice
 
Query.findInvoice(
uid: String!
): Response_AccountInvoice
Query.allInvoicesPageable(
pageableParam: PageableParamInput
