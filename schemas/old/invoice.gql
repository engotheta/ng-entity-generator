description: String
dueDate: LocalDate
finalApprovedBy: User
finalApprovedByUsername: String
finalApprovedDate: LocalDateTime
financialYear: FinancialYear
id: Long
invoiceDate: LocalDate
invoiceNumber: String
isApprovalCompleted: Boolean
isDeleted: Boolean
