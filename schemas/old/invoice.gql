}

type InvoiceItemDtoInput {
accountUid: String!
description: String!
quantity: BigDecimal!
uid: String
unitPrice: BigDecimal!
}

type AccountInvoiceLineItem {
account: ChartOfAccount
active: Boolean
amount: BigDecimal
createdAt: LocalDateTime
createdBy: User
createdById: Long
deletedAt: LocalDateTime
deletedBy: Long
deletedId: Long
description: String
id: Long
invoice: AccountInvoice
isDeleted: Boolean
migrated: Boolean
quantity: BigDecimal
uid: String
